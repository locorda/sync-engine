include: package:lints/core.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/vocab/generated/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unnecessary_this
    - type_annotate_public_apis
