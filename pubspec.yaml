name: locorda_workspace
description: Workspace for the locorda monorepo
version: 0.1.0-dev
homepage: https://locorda.dev/
repository: https://github.com/locorda/locorda
issue_tracker: https://github.com/locorda/locorda/issues
documentation: https://locorda.dev/

environment:
  sdk: ^3.6.0

workspace:
  - packages/locorda
  - packages/locorda_flutter_core
  - packages/locorda_flutter
  - packages/locorda_annotations
  - packages/locorda_builder
  - packages/locorda_core
  - packages/locorda_objects
  - packages/locorda_drift
  - packages/locorda_solid
  - packages/locorda_solid_core
  - packages/locorda_solid_auth
  - packages/locorda_solid_auth_worker
  - packages/locorda_ui
  - packages/locorda_worker
  - packages/locorda_gdrive
  - packages/locorda/example

dev_dependencies:
  melos: ^7.3.0


melos:
  name: locorda
  
  command:
    version:
      linkToCommits: true
      branch: main
      workspaceChangelog: true

  scripts:
    analyze:
      run: dart analyze .
      description: Run analysis for all packages.

    test:
      run: |
        dart run melos exec --dir-exists=test --no-flutter -- dart test
        dart run melos exec --dir-exists=test --flutter --concurrency=1 -- flutter test
      description: Run tests for all packages (Dart and Flutter).

    test:dart:
      run: dart run melos exec --dir-exists=test --no-flutter -- dart test
      description: Run tests for pure Dart packages only.

    test:flutter:
      run: dart run melos exec --dir-exists=test --flutter --concurrency=1 -- flutter test
      description: Run tests for Flutter packages only.

    format:
      run: dart format .
      description: Run formatting for all packages.

    lint:
      run: dart analyze && dart format --set-exit-if-changed .
      description: Run linting (analyze + format check) for all packages.

    clean:
      run: dart pub get
      description: Clean and get dependencies for all packages.

    version:
      run: melos version
      description: Update package versions with conventional commits and changelog generation.

    publish:
      run: melos publish
      description: Publish all packages to pub.dev (with confirmations).

    release:
      run: melos version --no-git-tag-version && melos publish --dry-run
      description: Preview a full release (version + publish preview).
