name: locorda_core
description: Platform-agnostic CRDT sync engine for Locorda. Runtime for offline-first conflict resolution, sharded index management, and BYOB backend sync (Google Drive, Solid Pods, and more).
version: 0.5.1
resolution: workspace
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
documentation: https://locorda.dev/

topics:
  - rdf
  - crdt
  - offline-first
  - sync

environment:
  sdk: ^3.6.0

dependencies:
  logging: ^1.3.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  rxdart: ^0.28.0

  # RDF
  locorda_rdf_core: ^0.12.2
  locorda_rdf_terms_core: ^0.12.2
  locorda_rdf_jelly: ^0.12.2
  http: ^1.5.0
  collection: ^1.19.1
  

dev_dependencies:
  locorda_rdf_canonicalization: ^0.12.2
  test: ^1.26.3
  lints: ">=5.1.1 <7.0.0"
  build_runner: ^2.8.0
  locorda_rdf_terms_generator: ^0.12.2
  locorda_mapping_bootstrap_generator: ^0.5.1  
  locorda_objects: any
  personal_notes_app: any
