builders:
  crdt_mapping_generator:
    import: "package:locorda_init_generator/builder.dart"
    builder_factories: ["crdtMappingBuilder"]
    build_extensions:
      lib/{{}}.dart:
        - lib/{{}}.crdt.cache.trig
    auto_apply: dependents
    build_to: cache
    runs_before:
      - locorda_mapping_bootstrap_generator:mapping_bootstrap
    defaults:
      generate_for:
        - lib/**.dart

  init_locorda_generator:
    import: "package:locorda_init_generator/builder.dart"
    builder_factories: ["initLocordaBuilder"]
    build_extensions:
      pubspec.yaml:
        - lib/init_locorda.g.dart
    auto_apply: dependents
    build_to: source
    required_inputs:
      - lib/worker_generated.g.dart       # Optional: for worker detection
      - lib/init_rdf_mapper.g.dart        # Optional: for mapper detection
      - lib/locorda_config.g.dart         # Optional: for config detection
    defaults:
      generate_for:
        - pubspec.yaml

  locorda_config_generator:
    import: "package:locorda_init_generator/builder.dart"
    builder_factories: ["configBuilder"]
    build_extensions:
      pubspec.yaml:
        - lib/locorda_config.g.dart
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        - pubspec.yaml
