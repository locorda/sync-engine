name: locorda_drift
description: SQLite storage backend for Locorda using Drift ORM. Cross-platform offline storage (iOS, Android, macOS, Windows, Linux, Web) for BYOB sync engines.
version: 0.5.2
resolution: workspace
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues

topics:
  - offline-first
  - crdt
  - storage
  - drift
  - sqlite

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  locorda_core: ^0.5.2
  locorda_worker: ^0.5.2
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  sqlite3: ^3.0.0
  locorda_rdf_core: ^0.12.2
  locorda_rdf_jelly: ^0.12.2
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.31.0
  build_runner: ^2.4.0
  lints: ">=5.1.1 <7.0.0"
  test: ^1.26.3  