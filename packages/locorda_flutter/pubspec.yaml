name: locorda_flutter
description: Flutter integration for Locorda BYOB sync — combines ObjectSyncEngine, worker architecture, and UI widgets into a single Locorda facade for offline-first Flutter apps.
version: 0.5.2
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_core: ^0.5.2
  locorda_flutter_core: ^0.5.2
  locorda_objects: ^0.5.2
  locorda_worker: ^0.5.2
  locorda_ui: ^0.5.2
  locorda_rdf_core: ^0.12.2
  locorda_rdf_mapper: ^0.12.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - crdt
  - offline-first
  - sync
  - flutter