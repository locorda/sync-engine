name: locorda_solid
description: Locorda Solid - Sync offline-first apps using your user's remote storage
version: 0.5.1
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_core: ^0.5.1
  locorda_flutter_core: ^0.5.1
  locorda_solid_core: ^0.5.1
  locorda_solid_auth: ^0.5.1
  locorda_worker: ^0.5.1
  locorda_solid_auth_worker: ^0.5.1

  # Solid authentication
  solid_oidc_auth: ^0.2.1
  oidc_core: ^0.16.1

  # HTTP
  http: ^1.1.0
  logging: ^1.3.0

  # RDF
  locorda_rdf_core: ^0.12.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync