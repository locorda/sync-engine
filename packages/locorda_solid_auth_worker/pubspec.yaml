name: locorda_solid_auth_worker
description: Solid authentication bridge for Locorda worker architecture. Synchronizes auth state from main thread to worker isolate.
version: 0.5.0
resolution: workspace
homepage: https://github.com/locorda/locorda

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  locorda_core: ^0.5.0
  locorda_worker: ^0.5.0
  locorda_solid_core: ^0.5.0

  # Solid authentication
  solid_oidc_auth: ^0.2.1
  
  # RDF mapping
  locorda_rdf_core: ^0.12.2


dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.3

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync