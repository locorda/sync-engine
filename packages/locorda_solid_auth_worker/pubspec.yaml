name: locorda_solid_auth_worker
description: Solid authentication bridge for Locorda worker architecture. Synchronizes auth state from main thread to worker isolate.
version: 0.1.0-dev
resolution: workspace
publish_to: none
publisher: locorda.dev
homepage: https://github.com/locorda/locorda

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_core: any
  locorda_worker: any
  locorda_solid_core: any
# Solid AUTH
  # TODO: Use published version when available
  solid_auth:
    git:
      url: https://github.com/kkalass/solid_auth.git
      ref: feat/dpop-worker-thread-support
  
  
  # RDF mapping
  locorda_rdf_core: ^0.11.6


dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.3

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync