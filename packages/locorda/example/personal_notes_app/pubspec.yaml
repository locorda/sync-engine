name: personal_notes_app
description: Simple offline-first personal notes app demonstrating locorda
publish_to: none
version: 0.1.0-dev
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Drift (SQLite) storage
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  
  # Solid AUTH
  # TODO: Use published version when available
  solid_auth:
    git:
      url: https://github.com/kkalass/solid_auth.git
      ref: feat/dpop-worker-thread-support
      
  # Locorda Sync packages
  locorda: any

  # Remote storage implementations - dir is used for testing, Solid/GDrive are used in production
  locorda_solid: any
  locorda_gdrive: any
  locorda_dir: any

  # We need RdfGraph to be passed through in our models
  locorda_rdf_core: ^0.12.0

  # RDF Vocabularies we use
  locorda_rdf_terms_schema: ^0.12.0
  locorda_rdf_terms_common: ^0.12.0
  locorda_rdf_terms_core: ^0.12.0
  
  # UI
  flutter_chips_input: ^2.0.0

  # Google Sign-In
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0

  # Reactive streams
  rxdart: ^0.28.0

  # Logging
  logging: ^1.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.0
  drift_dev: ^2.31.0
  locorda_dev: any

  # Needed by tests to verify RDF output
  locorda_rdf_mapper: ^0.12.0

  # Documentation
  excerpter:
    git:
      url: https://github.com/dart-lang/site-shared.git
      path: pkgs/excerpter
  
flutter:
  uses-material-design: true

  