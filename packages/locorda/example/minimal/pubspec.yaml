name: minimal_task_sync
description: Minimal example demonstrating Locorda sync (~150 LOC)
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Core Locorda packages
  locorda: ^0.5.2                # Main package (includes annotations)
  locorda_dir: ^0.5.2            # Testing remote (use Solid/GDrive in production)
  
  # Utilities
  logging: ^1.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.0
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.0
  locorda_dev: ^0.5.2
  
  # Needed by tests to verify RDF output
  locorda_rdf_core: ^0.12.2
  locorda_rdf_mapper: ^0.12.2

flutter:
  uses-material-design: true
