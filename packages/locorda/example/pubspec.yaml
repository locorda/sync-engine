name: personal_notes_app
description: Simple offline-first personal notes app demonstrating locorda
publish_to: none
version: 0.1.0-dev
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Drift (SQLite) storage
  drift: ^2.19.0
  drift_flutter: ^0.2.0
  
  # Solid AUTH
  # TODO: Use published version when available
  solid_auth:
    git:
      url: https://github.com/kkalass/solid_auth.git
      ref: feat/dpop-worker-thread-support
      
  # Solid CRDT Sync packages
  locorda: any
  locorda_core: any
  locorda_annotations: any
  locorda_dir: any

  # RDF mapping
  locorda_rdf_core: ^0.11.4
  locorda_rdf_mapper: ^0.11.4
  locorda_rdf_terms_schema: ^0.11.4
  locorda_rdf_terms_core: ^0.11.4
  locorda_rdf_mapper_annotations: ^0.11.4
  
  # UI
  flutter_chips_input: ^2.0.0

  # Google Sign-In
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0

  # Reactive streams
  rxdart: ^0.28.0

  # Logging
  logging: ^1.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.0
  drift_dev: ^2.19.0
  locorda_rdf_mapper_generator: ^0.11.4
  locorda_builder: any
  
flutter:
  uses-material-design: true

  