name: locorda
description: Locorda - Sync offline-first apps using your user's remote storage
version: 0.5.1
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_core: ^0.5.1
  locorda_drift: ^0.5.1
  locorda_flutter_core: ^0.5.1
  locorda_flutter: ^0.5.1
  locorda_objects: ^0.5.1
  locorda_ui: ^0.5.1
  locorda_worker: ^0.5.1
  
  # Annotations for model classes
  locorda_annotations: ^0.5.1
  
  # RDF mapping
  locorda_rdf_core: ^0.12.2
  locorda_rdf_mapper: ^0.12.2
  locorda_rdf_mapper_annotations: ^0.12.2

  # Web Worker support (modern API)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.11.1
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync

false_secrets:
  - /example/**/*.plist
  - /example/**/index.html