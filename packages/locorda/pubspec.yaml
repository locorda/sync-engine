name: locorda
description: Locorda - Sync offline-first apps using your user's remote storage
version: 0.1.0-dev
publish_to: none
publisher: locorda.dev
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_drift: any
  locorda_solid: any
  locorda_flutter_core: any
  locorda_flutter: any
  locorda_worker: any
  
  # RDF mapping
  locorda_rdf_core: ^0.11.5
  locorda_rdf_mapper: ^0.11.5

  # Web Worker support (modern API)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync