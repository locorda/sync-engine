name: locorda
description: Locorda - Sync offline-first apps using your user's remote storage
version: 0.5.0
publisher: locorda.dev
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_drift: ^0.5.0
  locorda_flutter_core: ^0.5.0
  locorda_flutter: ^0.5.0
  locorda_worker: ^0.5.0
  
  # Annotations for model classes
  locorda_annotations: ^0.5.0
  
  # RDF mapping
  locorda_rdf_core: ^0.12.2
  locorda_rdf_mapper: ^0.12.2
  locorda_rdf_mapper_annotations: ^0.12.2

  # Web Worker support (modern API)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync