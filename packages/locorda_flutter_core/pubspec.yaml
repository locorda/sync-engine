name: locorda_flutter_core
description: Shared contracts for Locorda Flutter backends — defines RemoteIntegration, LocordaGraph, and the interface that backend packages (Google Drive, Solid Pods, etc.) implement.
version: 0.5.1
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_core: ^0.5.1
  locorda_worker: ^0.5.1
  locorda_ui: ^0.5.1
  
  # RDF mapping
  locorda_rdf_core: ^0.12.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - crdt
  - offline-first
  - sync
  - flutter
  - rdf