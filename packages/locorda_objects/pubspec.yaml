name: locorda_objects
description: Type-safe Dart API for Locorda CRDT sync. Wraps SyncEngine with ObjectSyncEngine — save<T>(), hydrateStream<T>(), delete<T>() without handling RDF directly.
version: 0.5.1
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  locorda_core: ^0.5.1
  logging: ^1.3.0
  
  # RDF mapping
  locorda_rdf_core: ^0.12.2
  locorda_rdf_mapper: ^0.12.2

dev_dependencies:
  test: ^1.26.3

topics:
  - rdf
  - crdt
  - offline-first
  - sync