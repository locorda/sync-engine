builders:
  # Generates lib/worker_generated.g.dart from discovered manifest files
  # Note: Named worker_generated.g.dart (not worker.g.dart) to avoid collision
  # with source_gen:combining_builder when manual worker.dart exists
  worker_generator:
    import: "package:locorda_builder/builder.dart"
    builder_factories: ["workerGeneratorBuilder"]
    build_extensions:
      pubspec.yaml:
        - lib/worker_generated.g.dart
    auto_apply: dependents
    build_to: source
    required_inputs:
      - lib/src/generated/mapping_bootstrap.g.dart  # Optional dependency
    defaults:
      generate_for:
        - pubspec.yaml
      options:
        # Packages to exclude from manifest discovery
        exclude_packages: []
        # Custom manifest file paths (for non-standard locations)
        manifest_files: ['lib/locorda_worker.manifest.dart']
        # Optional: Import path for onWorkerSpawn callback
        on_worker_spawn_import: null
        # Optional: Function name for onWorkerSpawn callback
        on_worker_spawn_function: null

  # Compiles worker files to JavaScript with distinct outputs:
  # - lib/worker.dart → web/worker.dart.js (manual)
  # - lib/worker_generated.g.dart → web/worker_generated.dart.js (generated)
  # Different output names prevent build collisions
  web_worker:
    import: "package:locorda_builder/builder.dart"
    builder_factories: ["webWorkerBuilder"]
    build_extensions:
      lib/worker.dart:
        - web/worker.dart.js
        - web/worker.dart.js.map
      lib/worker_generated.g.dart:
        - web/worker_generated.dart.js
        - web/worker_generated.dart.js.map
    auto_apply: dependents
    required_inputs:
      - ".g.dart"
    build_to: source
    defaults:
      generate_for:
        - lib/worker.dart
        - lib/worker_generated.g.dart
