name: locorda_gdrive
description: Locorda Google Drive - Google Drive backend and authentication for locorda
version: 0.5.1
resolution: workspace
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues

topics:
  - google-drive
  - authentication
  - oauth2

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  logging: ^1.3.0
  http: ^1.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  crypto: ^3.0.3
  path: ^1.9.1
  
  # Locorda dependencies
  rxdart: ^0.28.0
  locorda_core: ^0.5.1
  locorda_ui: ^0.5.1
  locorda_worker: ^0.5.1
  locorda_flutter_core: ^0.5.1
  
  # RDF dependencies
  locorda_rdf_core: ^0.12.2

  # Google Drive API
  googleapis: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ">=5.1.1 <7.0.0"

flutter:
  generate: true
  uses-material-design: true
