name: locorda_worker
description: Platform-agnostic isolate/web worker infrastructure for Locorda. Offloads CRDT merging, SQLite I/O, and backend HTTP (Google Drive, Solid Pods, etc.) to a background thread.
version: 0.5.1
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  logging: ^1.3.0
  http: ^1.1.0
  locorda_core: ^0.5.1
  
  # RDF mapping
  locorda_rdf_core: ^0.12.2
  locorda_rdf_jelly: ^0.12.2

  # Web Worker support (modern API)
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.13
  test: ^1.26.3

topics:
  - crdt
  - offline-first
  - sync
  - google-drive
  - isolate