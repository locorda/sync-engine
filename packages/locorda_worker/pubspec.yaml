name: locorda_worker
description: Worker infrastructure for Locorda - Platform-agnostic isolate/worker architecture for offloading heavy operations (CRDT, DB, HTTP) to separate thread.
version: 0.1.0-dev
resolution: workspace
publish_to: none
publisher: locorda.dev
homepage: https://github.com/locorda/locorda

environment:
  sdk: ^3.6.0

dependencies:
  logging: ^1.3.0
  locorda_core: any
  
  # RDF mapping
  locorda_rdf_core: ^0.11.10
  locorda_rdf_jelly: ^0.11.10

  # Web Worker support (modern API)
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.13
  test: ^1.26.3

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync