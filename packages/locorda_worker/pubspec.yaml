name: locorda_worker
description: Worker infrastructure for Locorda - Platform-agnostic isolate/worker architecture for offloading heavy operations (CRDT, DB, HTTP) to separate thread.
version: 0.5.1
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  logging: ^1.3.0
  http: ^1.1.0
  locorda_core: ^0.5.1
  
  # RDF mapping
  locorda_rdf_core: ^0.12.2
  locorda_rdf_jelly: ^0.12.2

  # Web Worker support (modern API)
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.13
  test: ^1.26.3

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync