name: locorda_dir
description: Local filesystem backend for Locorda BYOB sync. Primarily for development and testing; also works with mounted network/cloud drives on macOS/Linux.
version: 0.5.1
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_core: ^0.5.1
  locorda_flutter_core: ^0.5.1
  locorda_worker: ^0.5.1

  # RDF
  locorda_rdf_core: ^0.12.2
  
  # File system paths
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  
  # Utilities
  rxdart: ^0.28.0
  crypto: ^3.0.6
  logging: ^1.3.0
  shared_preferences: ^2.3.5
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - crdt
  - offline-first
  - filesystem
  - sync