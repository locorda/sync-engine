name: locorda_dir
description: Locorda Dir - (local) directory backend for Locorda sync engine
version: 0.1.0-dev
publish_to: none
publisher: locorda.dev
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  locorda_core: any
  locorda_flutter_core: any
  locorda_worker: any

  # RDF
  locorda_rdf_core: ^0.11.4
  
  # File system paths
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ">=8.1.4 <11.0.0"
  
  # Utilities
  crypto: ^3.0.6
  logging: ^1.3.0
  shared_preferences: ^2.3.5
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

topics:
  - rdf
  - crdt
  - solid
  - offline-first
  - sync