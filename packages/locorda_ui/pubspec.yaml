name: locorda_ui
description: Flutter sync status UI for Locorda. Provides MultiBackendStatusWidget, SyncRefreshIndicator, and backend status adapters for Google Drive, Solid Pods, and more.
version: 0.5.2
homepage: https://locorda.dev/sync-engine/
repository: https://github.com/locorda/sync-engine
issue_tracker: https://github.com/locorda/sync-engine/issues
resolution: workspace

topics:
  - flutter
  - offline-first
  - sync
  - widgets

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  logging: ^1.3.0
  locorda_core: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ">=5.1.1 <7.0.0"

flutter:
  generate: true

