name: Bug Report
description: Report a bug in Locorda
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package(s) are affected?
      multiple: true
      options:
        - locorda (main package / general)
        - locorda_core
        - locorda_annotations
        - locorda_builder
        - locorda_dev
        - locorda_dir
        - locorda_drift
        - locorda_flutter
        - locorda_flutter_core
        - locorda_gdrive
        - locorda_init_generator
        - locorda_mapping_bootstrap_generator
        - locorda_objects
        - locorda_solid
        - locorda_solid_auth
        - locorda_solid_auth_worker
        - locorda_solid_core
        - locorda_solid_ui
        - locorda_ui
        - locorda_worker
        - unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Configure sync engine with ...
        2. Call syncSystem.save(...)
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) are affected?
      multiple: true
      options:
        - Dart only (no Flutter)
        - Flutter (Android)
        - Flutter (iOS)
        - Flutter (macOS)
        - Flutter (Windows)
        - Flutter (Linux)
        - Flutter (Web)
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Dart/Flutter version, OS, relevant package versions.
      placeholder: |
        Dart SDK: 3.x.x
        Flutter: (if applicable, include selected platform above)
        locorda_core: x.x.x
        OS: macOS / Linux / Windows
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Logs, stack traces, or anything else that might help.
    validations:
      required: false
