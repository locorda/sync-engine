name: Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Locorda!

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package(s) would this feature belong to?
      multiple: true
      options:
        - locorda (main package / general)
        - locorda_core
        - locorda_annotations
        - locorda_builder
        - locorda_dev
        - locorda_dir
        - locorda_drift
        - locorda_flutter
        - locorda_flutter_core
        - locorda_gdrive
        - locorda_init_generator
        - locorda_mapping_bootstrap_generator
        - locorda_objects
        - locorda_solid
        - locorda_solid_auth
        - locorda_solid_auth_worker
        - locorda_solid_core
        - locorda_solid_ui
        - locorda_ui
        - locorda_worker
        - new package
        - unknown / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Why is this needed?
      placeholder: As a developer building an offline-first app, I want to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like. Include API sketches if helpful.
      placeholder: |
        Add a `syncSystem.xyz()` method that ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, examples, related issues, or anything else that might help.
    validations:
      required: false
