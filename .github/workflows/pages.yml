# DEPRECATED: This workflow is no longer used for deployment
# Sync-engine content is now deployed via the locorda/locorda homepage repository
# See .github/HOMEPAGE_INTEGRATION.md for details
#
# To trigger homepage deployment, see .github/workflows/trigger-homepage-deploy.yml

name: Deploy GitHub Pages from doc/ (DEPRECATED)

on:
  workflow_dispatch:  # Manual trigger only
  # push:
  #   branches: [main]
  #   paths:
  #     - 'doc/**'
  #     - 'spec/vocabularies/**'
  #     - 'spec/mappings/**'
  #     - 'packages/locorda/example/personal_notes_app/**'
  #     - '.github/workflows/pages.yml'
  #     - 'pubspec.yaml'
  #     - 'README.md'

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true

      - name: Setup Dart/Melos
        run: |
          dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Build Flutter web app
        run: |
          cd packages/locorda/example/personal_notes_app
          flutter build web --release --base-href /example/personal_notes_app/

      - name: Setup deployment structure
        run: |
          rm -rf docs
          cp -r doc docs

          # Create vocab and mappings directories
          mkdir -p docs/vocab
          mkdir -p docs/mappings

          # Copy vocabularies to /vocab path
          cp spec/vocabularies/* docs/vocab/

          # Copy mappings to /mappings path
          cp spec/mappings/* docs/mappings/

          # Create example app directory and copy built web app
          mkdir -p docs/example/personal_notes_app/mappings
          mkdir -p docs/example/personal_notes_app/auth
          cp -r packages/locorda/example/personal_notes_app/build/web/* docs/example/personal_notes_app/

          # Copy example-specific mappings to the app's mappings directory
          cp packages/locorda/example/personal_notes_app/assets/contracts/mappings/* docs/example/personal_notes_app/mappings/

          # Copy auth configuration files
          cp packages/locorda/example/personal_notes_app/assets/contracts/auth/client-config.json docs/example/personal_notes_app/auth/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
